<!--
  Supabase > Authentication > Emails > "Reset password".
  Subject: Novo geslo za vaš račun
  Paste the HTML below as the message body.

  The link goes to the salon's own /novo-geslo page ({{ .RedirectTo }} is set
  by the app, lib/auth.ts requestPasswordReset) with a one-time token_hash.
  It works on any device. {{ .RedirectTo }} is only used if it matches
  Authentication > URL Configuration > Redirect URLs; otherwise Supabase puts
  the Site URL there and the link will not work.
-->
<h2>Novo geslo</h2>
<p>Prejeli smo zahtevo za novo geslo za vaš račun ({{ .Email }}).</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery">Nastavite novo geslo</a></p>
<p>Povezava velja eno uro in jo lahko uporabite enkrat.</p>
<p>Če gesla niste želeli spremeniti, to sporočilo prezrite. Vaše geslo ostane enako.</p>
